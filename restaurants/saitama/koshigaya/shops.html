<p class="breadcrumb"><a href="../../../">TOP</a> / <a href="../../">飲食店</a> / <a href="../">埼玉県</a> / <a href="./">越谷市</a> / 飲食店一覧</p>
<div class="tools-heading-row"><h1>越谷市の飲食店一覧</h1><span id="publicRestaurantCount" class="tools-count">更新待ち</span></div>
<p class="notice">越谷市公式の「飲食店営業」許可データから、保育・学校・病院・福祉施設・社員食堂・厨房など明らかな非一般利用施設とコンビニを除外して自動分類しています。完全な営業中判定ではありません。来店前に最新情報をご確認ください。</p>

<div class="restaurant-filter-grid">
  <label><span>店名・住所</span><input type="search" id="publicRestaurantSearch" placeholder="例：越谷駅、ラーメン、店名"></label>
  <label><span>ジャンル</span>
    <select id="publicRestaurantCategory">
      <option value="">すべて</option>
      <option value="ramen">ラーメン</option>
      <option value="sushi">寿司・海鮮</option>
      <option value="yakiniku">焼肉</option>
      <option value="japanese">和食・定食</option>
      <option value="curry">カレー</option>
      <option value="italian">イタリアン</option>
      <option value="cafe">カフェ・スイーツ</option>
    </select>
  </label>
  <label><span>判定</span>
    <select id="publicRestaurantConfidence">
      <option value="">すべて</option>
      <option value="confirmed">確認済み</option>
      <option value="high">自動判定・高</option>
      <option value="medium">自動判定</option>
    </select>
  </label>
</div>

<div class="restaurant-list-status" id="publicRestaurantStatus"></div>
<div id="publicRestaurantList" class="facility-list" data-data-url="../../../assets/data/restaurants-koshigaya-public.json">
  <p class="notice">自動分類データを読み込んでいます…</p>
</div>
<div class="buttons"><button type="button" id="publicRestaurantMore">さらに50件表示</button></div>
<p class="feedback-note">誤分類・閉店・移転などを見つけた場合は <a href="../../../feedback.html">ご意見・情報提供</a> からお知らせください。</p>
