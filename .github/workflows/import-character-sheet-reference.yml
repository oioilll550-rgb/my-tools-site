name: Import character sheet reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-character-sheet-reference.yml"

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download character sheet
        run: |
          mkdir -p library/assets/reference
          ASSET_URL="$(cat library/assets/reference/.benrichan-character-sheet-url.txt)"
          curl -L --fail --retry 3 "$ASSET_URL" -o library/assets/reference/benrichan-character-sheet.png
          test -s library/assets/reference/benrichan-character-sheet.png
          file library/assets/reference/benrichan-character-sheet.png

      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/assets/reference/benrichan-character-sheet.png
          git diff --cached --quiet && exit 0
          git commit -m "Add Benrichan character sheet reference"
          git push
