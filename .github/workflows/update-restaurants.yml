name: Update Koshigaya restaurant permits

on:
  workflow_dispatch:
  schedule:
    # The city source is updated monthly, so daily polling would add load without benefit.
    # 23:25 UTC on the 15th = 08:25 JST on the 16th.
    - cron: "25 23 15 * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_koshigaya_restaurants.py"
      - ".github/workflows/update-restaurants.yml"

permissions:
  contents: write

concurrency:
  group: koshigaya-permit-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install --disable-pip-version-check pandas==2.2.3 xlrd==2.0.1 requests==2.32.3 beautifulsoup4==4.12.3
      - name: Build official restaurant permit list
        run: python scripts/update_koshigaya_restaurants.py
      - name: Commit data when changed
        run: |
          if git diff --quiet -- assets/data/restaurants-koshigaya-official.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/restaurants-koshigaya-official.json
          git commit -m "Update Koshigaya restaurant permit data"
          git push
