name: Sync facility database to Cloudflare D1
# Cloudflare credentials configured; this comment also triggers the first authenticated sync.

on:
  workflow_dispatch:
  schedule:
    # 00:20 UTC = 09:20 JST. A hash state prevents no-op daily imports.
    - cron: "20 0 * * *"
  push:
    branches: [main]
    paths:
      - "assets/data/facilities-*.json"
      - "database/migrations/**"
      - "worker/**"
      - "scripts/build_d1_seed.py"
      - ".github/workflows/sync-facility-d1.yml"

permissions:
  contents: write

concurrency:
  group: facility-d1-sync
  cancel-in-progress: false

env:
  DATABASE_NAME: benri-facilities
  WORKER_NAME: benri-facility-api
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check sync state
        id: syncstate
        shell: bash
        run: |
          HASH="$(sha256sum assets/data/facilities-koshigaya.json | awk '{print $1}')"
          OLD="$(cat .github/d1-sync-state.txt 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HASH" = "$OLD" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "D1 is already synchronized; scheduled run is a no-op."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare credentials
        if: steps.syncstate.outputs.needed == 'true'
        id: auth
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured yet; skipping D1 sync."
          fi

      - uses: actions/setup-node@v4
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Find or create D1 database
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$DATABASE_NAME&per_page=100"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          DB_ID="$(printf '%s' "$LIST_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("result") or []; print(rows[0].get("uuid","") if rows else "")')"

          if [ -z "$DB_ID" ]; then
            CREATE_JSON="$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"benri-facilities","primary_location_hint":"apac"}')"
            DB_ID="$(printf '%s' "$CREATE_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("uuid",""))')"
          fi

          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate Wrangler configuration
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > .wrangler.facility.jsonc <<EOF
          {
            "name": "$WORKER_NAME",
            "main": "worker/src/index.js",
            "compatibility_date": "2026-09-01",
            "workers_dev": true,
            "vars": {
              "ALLOWED_ORIGIN": "https://oioilll550-rgb.github.io"
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "$DATABASE_NAME",
                "database_id": "$DB_ID",
                "migrations_dir": "database/migrations"
              }
            ]
          }
          EOF

      - name: Apply D1 migrations
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        run: npx --yes wrangler@latest d1 migrations apply "$DATABASE_NAME" --remote --config .wrangler.facility.jsonc

      - name: Build D1 seed chunks
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        run: python scripts/build_d1_seed.py

      - name: Sync facility rows
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in .tmp/d1-seed/*.sql; do
            echo "Importing $file"
            npx --yes wrangler@latest d1 execute "$DATABASE_NAME" --remote --config .wrangler.facility.jsonc --file "$file" --yes
          done

      - name: Deploy facility API Worker
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        run: npx --yes wrangler@latest deploy --config .wrangler.facility.jsonc

      - name: Resolve Worker URL and verify
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN_JSON="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          SUBDOMAIN="$(printf '%s' "$SUBDOMAIN_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain",""))')"
          test -n "$SUBDOMAIN"
          API_URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev"
          curl -fsS "$API_URL/api/health"
          echo
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Switch site to D1 API
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          API_URL: ${{ steps.worker.outputs.api_url }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("assets/js/config.js")
          text = path.read_text(encoding="utf-8")
          url = os.environ["API_URL"]
          text = re.sub(r'facilityApiUrl:\s*"[^"]*"', f'facilityApiUrl: "{url}"', text)
          path.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet -- assets/js/config.js; then
            echo "Site already points at $API_URL"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/config.js
          git commit -m "Switch facility search to Cloudflare D1"
          git pull --rebase origin main
          git push

      - name: Record successful D1 sync state
        if: steps.syncstate.outputs.needed == 'true' && steps.auth.outputs.ready == 'true' && success()
        shell: bash
        run: |
          printf '%s\n' "${{ steps.syncstate.outputs.hash }}" > .github/d1-sync-state.txt
          if git diff --quiet -- .github/d1-sync-state.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/d1-sync-state.txt
          git commit -m "Record D1 sync state"
          git pull --rebase origin main
          git push
