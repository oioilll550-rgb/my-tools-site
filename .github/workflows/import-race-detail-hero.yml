name: Import individual race hero

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-race-detail-hero.yml"

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        run: |
          mkdir -p assets/images
          HERO_URL="$(cat assets/data/race-detail-hero-url.txt)"
          curl -L --fail --retry 3 "$HERO_URL" -o assets/images/horse-racing-detail-hero.png
          test -s assets/images/horse-racing-detail-hero.png
          file assets/images/horse-racing-detail-hero.png

      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/horse-racing-detail-hero.png
          git diff --cached --quiet && exit 0
          git commit -m "Add individual race hero image"
          git push
