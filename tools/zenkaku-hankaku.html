<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全角・半角変換 | My Tools Site</title>
  <meta name="description" content="英数字や記号を全角または半角に無料で変換できるWebツールです。">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="site-title"><a href="../">My Tools Site</a></div>
    <nav aria-label="メインナビゲーション"><a href="../#tools">ツール一覧</a><a href="../privacy.html">プライバシー</a></nav>
  </div>
</header>

<main>
  <section class="card">
    <h1>全角・半角変換</h1>
    <p>入力した英数字やASCII記号を、全角または半角に変換します。</p>

    <textarea id="inputText" placeholder="ここに変換したい文字を入力してください" aria-label="変換する文字"></textarea>

    <div class="buttons">
      <button type="button" id="halfButton">半角に変換</button>
      <button type="button" id="fullButton">全角に変換</button>
      <button type="button" class="secondary" id="clearButton">クリア</button>
    </div>

    <textarea id="outputText" placeholder="変換結果がここに表示されます" aria-label="変換結果" readonly></textarea>

    <div class="buttons">
      <button type="button" id="copyButton">結果をコピー</button>
    </div>
    <div class="message" id="message" aria-live="polite"></div>

    <p class="notice">半角カタカナと全角カタカナの相互変換には現在対応していません。処理はブラウザ内で行われます。</p>
    <a class="back" href="../">← TOPページへ戻る</a>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <span>© <span data-current-year>2026</span> My Tools Site</span>
    <span><a href="../privacy.html">プライバシーポリシー</a></span>
  </div>
</footer>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/zenkaku-hankaku.js"></script>
</body>
</html>
