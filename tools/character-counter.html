<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字数カウンター | My Tools Site</title>
  <meta name="description" content="入力した文章の文字数、空白を除いた文字数、行数、空白区切りの単語数を無料で確認できます。">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="site-title"><a href="../">My Tools Site</a></div>
    <nav aria-label="メインナビゲーション"><a href="../#tools">ツール一覧</a><a href="../privacy.html">プライバシー</a></nav>
  </div>
</header>

<main>
  <section class="card">
    <h1>文字数カウンター</h1>
    <p>入力した文章の文字数をリアルタイムで確認できます。</p>

    <textarea id="text" placeholder="ここに文章を入力してください" aria-label="文字数を数える文章"></textarea>

    <div class="stats">
      <div class="stat"><div class="stat-label">文字数</div><div class="stat-number" id="characterCount">0</div></div>
      <div class="stat"><div class="stat-label">空白を除いた文字数</div><div class="stat-number" id="noSpaceCount">0</div></div>
      <div class="stat"><div class="stat-label">行数</div><div class="stat-number" id="lineCount">0</div></div>
      <div class="stat"><div class="stat-label">単語数（空白区切り）</div><div class="stat-number" id="wordCount">0</div></div>
    </div>

    <div class="buttons">
      <button type="button" id="copyButton">文章をコピー</button>
      <button type="button" class="secondary" id="clearButton">クリア</button>
    </div>
    <div class="message" id="message" aria-live="polite"></div>

    <p class="notice">このツールの処理はブラウザ内で行われます。</p>
    <a class="back" href="../">← TOPページへ戻る</a>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <span>© <span data-current-year>2026</span> My Tools Site</span>
    <span><a href="../privacy.html">プライバシーポリシー</a></span>
  </div>
</footer>

<script src="../assets/js/site.js"></script>
<script src="../assets/js/character-counter.js"></script>
</body>
</html>
