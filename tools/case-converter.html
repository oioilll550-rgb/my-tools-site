<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大文字・小文字変換 | べんりちゃん、微力ながら</title>
  <meta name="description" content="英字を大文字・小文字へ一括変換できる無料ツールです。">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="site-title"><a href="../">べんりちゃん、微力ながら</a></div>
    <nav aria-label="メインナビゲーション"><a href="../#tools">ツール一覧</a><a href="../privacy.html">プライバシー</a></nav>
  </div>
</header>
<main>

  <section class="card">
    <h1>大文字・小文字変換</h1>
    <p>英字をまとめて大文字または小文字へ変換します。</p>
    <textarea id="inputText" placeholder="ここに英字を含む文章を入力してください" aria-label="変換する文章"></textarea>
    <div class="buttons">
      <button type="button" id="upperButton">大文字に変換</button>
      <button type="button" id="lowerButton">小文字に変換</button>
      <button type="button" class="secondary" id="clearButton">クリア</button>
    </div>
    <textarea id="outputText" placeholder="結果がここに表示されます" readonly aria-label="変換結果"></textarea>
    <div class="buttons"><button type="button" id="copyButton">結果をコピー</button></div>
    <div class="message" id="message" aria-live="polite"></div>
    <aside class="ad-slot" aria-label="広告" hidden><span class="ad-slot-label">広告</span></aside>
    <p class="notice">日本語や数字などはそのまま保持されます。処理はブラウザ内で行われます。</p>
    <a class="back" href="../">← TOPページへ戻る</a>
  </section>
</main>
<footer>
  <div class="footer-inner">
    <span>© <span data-current-year>2026</span> べんりちゃん、微力ながら</span>
    <span><a href="../privacy.html">プライバシーポリシー</a></span>
  </div>
</footer>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/case-converter.js"></script>
</body>
</html>
